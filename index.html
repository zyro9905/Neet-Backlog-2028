<style>

.student-name{line-height:1.2} .student-name:active{opacity:.75}
.home-identity{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid rgba(255,255,255,.42);border-radius:17px;background:rgba(255,255,255,.22);box-shadow:0 6px 20px #0000000b,inset 0 1px 0 #ffffff70;backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);margin-bottom:5px}
.home-identity .identity-copy{min-width:0;display:flex;flex-direction:column;gap:3px}.home-identity .date-pill,.home-identity .greeting-pill,.home-identity .developer-pill{width:fit-content;max-width:100%;border:1px solid #ffffff30;background:rgba(255,255,255,.27);box-shadow:inset 0 1px 0 rgba(255,255,255,.55);backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);border-radius:9px;padding:3px 7px}.home-identity .date-pill{font-size:11px}.home-identity .greeting-pill{font-size:23px;line-height:1.05;font-weight:850;letter-spacing:-.04em}.home-identity .student-name{border:1px solid #ffffff30!important;background:rgba(255,255,255,.30)!important;backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)!important;border-radius:9px!important;padding:4px 8px!important;margin:0!important;font-size:19px!important;font-weight:900!important}.home-identity .developer-pill{font-size:9px;color:var(--mut);letter-spacing:.01em}.subject-icon{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:12px;background:color-mix(in srgb,var(--c,var(--pr)) 14%,transparent);font-size:21px}.subject-head{display:flex;align-items:center;gap:9px;min-width:0}.home-identity h1{font-size:25px}.home-identity .sm{flex:none}

.rail{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}

:focus-visible{outline:3px solid var(--pr);outline-offset:2px}

input[type=color]{width:44px;height:36px;padding:2px;margin:0;border-radius:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="wp"></div><div id="app"></div><nav id="nav"></nav>
<script>
const K='backlog-planner-v1',$a=document.getElementById('app'),$n=document.getElementById('nav');
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const add=(n,b)=>{const d=b?new Date(b+'T00:00'):new Date();d.setDate(d.getDate()+n);return dk(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const hm=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'};
const P=['','Low','Medium','High'],PC=['','#8a90b0','#e08a00','#e0334f'];
const mk=(sub,ch,t,dur,pri,spd)=>({id:uid(),sub,ch,t,dur,pri,spd:Math.min(2.5,Math.max(1,+spd||1.5)),st:'todo'});
function seed(){return{subs:[{id:'p',n:'Physics',c:'#4b3fe0'},{id:'c',n:'Chemistry',c:'#e08a00'},{id:'b',n:'Biology',c:'#0f9d72'}],
lecs:[mk('p','Rotational Motion','Lec 02: Moment of Inertia',100,3),mk('p','Rotational Motion','Lec 03: Parallel & Perpendicular Axes',85,3),mk('p','Rotational Motion','Lec 04: Torque and Angular Momentum',110,2),mk('p','Thermodynamics','Lec 02: Processes and Work',80,3),mk('c','Chemical Bonding','Lec 02: VSEPR Theory',90,3),mk('c','GOC','Lec 02: Resonance & Hyperconjugation',95,3),mk('c','GOC','Lec 03: Electrophiles & Nucleophiles',70,2),mk('b','Cell Cycle','Lec 01: Phases of Cell Cycle',60,2),mk('b','Cell Cycle','Lec 02: Meiosis',75,1)],
log:{},customPlans:{},hrs:5,spd:1.5,off:[],dl:add(21),goal:6,mix:'pri',studentName:'NEET Aspirant',ui:normUI()}}
const WP={none:'',aurora:'linear-gradient(135deg,#1e3a8a,#7c3aed 50%,#ec4899)',sunset:'linear-gradient(160deg,#ff9a56,#ff4e8b 55%,#5b2a86)',ocean:'linear-gradient(160deg,#0f4c75,#1b9aaa 60%,#a8e6cf)',forest:'linear-gradient(160deg,#134e4a,#2f855a 60%,#d4e09b)',mist:'linear-gradient(160deg,#e0f7ef,#c7d2fe)',mono:'linear-gradient(160deg,#111,#3a3a3a)'};
const ACC=['#4b3fe0','#0ea5e9','#0f9d72','#e0334f','#e08a00','#b5379c'],TL=['#ffffff','#1c2042','#fef3c7','#dcfce7','#e0f2fe','#fce7f3'],WL={fc:'Catch-up forecast',goal:'Daily goal ring',next:'Next up',tune:'Plan tuner',week:'This week',rev:'Revisions'};
const UI0={theme:'auto',acc:'#4b3fe0',tile:'',glass:0,wp:'none',dim:35,snd:1,vol:.6,w:['fc','goal','next','tune','week','rev']};
const normUI=u=>{const o=Object.assign({},UI0,u||{}),H=/^#[0-9a-f]{6}$/i;if(!['auto','light','dark'].includes(o.theme))o.theme='auto';if(!H.test(o.acc))o.acc=UI0.acc;if(o.tile&&!H.test(o.tile))o.tile='';o.vol=Math.min(1,Math.max(0,+o.vol||0));o.dim=Math.min(80,Math.max(0,+o.dim||0));o.w=Array.isArray(o.w)?o.w.filter(x=>WL[x]):UI0.w.slice();if(!(o.wp in WP)&&o.wp!=='custom')o.wp='none';o.glass=o.glass?1:0;o.snd=o.snd?1:0;return o};
const cid=s=>String(s==null?'':s).replace(/[^\w-]/g,'').slice(0,24)||uid(),DR=/^\d{4}-\d\d-\d\d$/;
const pdur=s=>{const m=String(s||'').trim().toLowerCase().match(/^(\d+(?:\.\d+)?)\s*(h|hr|hrs|m|min|mins)?$/);return m?Math.round(m[2]&&m[2][0]==='h'?m[1]*60:+m[1]):0};
function norm(d){if(!d||!Array.isArray(d.lecs)||!Array.isArray(d.subs)||!d.subs.length)return null;const b=seed();
 const subs=d.subs.map(s=>({id:cid(s.id),n:String(s.n||'Subject').slice(0,40),c:/^#[0-9a-f]{3,8}$/i.test(s.c)?s.c:'#4b3fe0'})),ok=new Set(subs.map(s=>s.id));
 const lecs=d.lecs.map(l=>({id:cid(l.id),sub:ok.has(cid(l.sub))?cid(l.sub):subs[0].id,ch:String(l.ch||'General').slice(0,60),t:String(l.t||'Lecture').slice(0,120),dur:Math.max(1,+l.dur||120),pri:Math.min(3,Math.max(1,+l.pri||2)),spd:Math.min(2.5,Math.max(1,+l.spd||d.spd||1.5)),st:l.st==='done'?'done':'todo',doneOn:DR.test(l.doneOn)?l.doneOn:null,rv:Array.isArray(l.rv)?l.rv.map(Number):[]}));
 const log=Object.fromEntries(Object.entries(d.log&&typeof d.log==='object'?d.log:{}).filter(([k,v])=>DR.test(k)&&v&&+v.t>0).map(([k,v])=>[k,{t:+v.t,s:v.s&&typeof v.s==='object'?v.s:{}}]));
 const customPlans=Object.fromEntries(Object.entries(d.customPlans&&typeof d.customPlans==='object'?d.customPlans:{}).filter(([k,v])=>DR.test(k)&&Array.isArray(v)).map(([k,v])=>[k,v.map(String)]));
 return{subs,lecs,log,customPlans,hrs:Math.min(12,Math.max(1,+d.hrs||b.hrs)),spd:Math.min(2.5,Math.max(1,+d.spd||1.5)),studentName:String(d.studentName||'NEET Aspirant').slice(0,50),off:Array.isArray(d.off)?d.off.map(Number).filter(x=>x>=0&&x<7):[],dl:DR.test(d.dl)?d.dl:b.dl,goal:Math.min(12,Math.max(1,+d.goal||6)),mix:d.mix==='bal'?'bal':'pri',ui:normUI(d.ui)}}
let S;try{S=norm(JSON.parse(localStorage.getItem(K)))}catch(e){}
if(!S)S=seed();
let saveErr=0;const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){if(!saveErr){saveErr=1;setTimeout(()=>toast('Storage full or blocked. Download a backup.'),0)}}};
const best=()=>{let b=0,n=0,p=null;Object.keys(S.log).filter(k=>lm(k)>0).sort().forEach(k=>{n=p&&add(1,p)===k?n+1:1;b=Math.max(b,n);p=k});return b};
const U={v:'home',sub:'all',q:'',add:0,day:0};
const T={mode:'cd',dur:50,run:0,end:0,start:0,sub:'p'};try{const x=JSON.parse(localStorage.getItem(K+'-t'));if(x&&x.run)Object.assign(T,x)}catch(e){}
const saveT=()=>{try{localStorage.setItem(K+'-t',JSON.stringify(T))}catch(e){}};
const sOf=id=>S.subs.find(s=>s.id===id)||S.subs[0];
const act=l=>l.dur/(l.spd||S.spd||1.5);
const addLog=(m,sub)=>{if(m>=1){const k=dk();S.log[k]=S.log[k]||{t:0,s:{}};S.log[k].t+=Math.round(m);S.log[k].s[sub]=(S.log[k].s[sub]||0)+Math.round(m);save()}};
const lm=k=>S.log[k]?S.log[k].t:0;
const streak=()=>{let n=0,d=dk();if(!lm(d))d=add(-1);while(lm(d)>0){n++;d=add(-1,d)}return n};

function plan(){
 const cap=S.hrs*60,order=S.subs.map(s=>s.id);
 let pend=S.lecs.filter(l=>l.st!=='done').sort((a,b)=>b.pri-a.pri||order.indexOf(a.sub)-order.indexOf(b.sub));
 if(S.mix==='bal'){const o=[];[3,2,1].forEach(p=>{const q=order.map(s=>pend.filter(l=>l.pri===p&&l.sub===s)).filter(a=>a.length);while(q.some(a=>a.length))q.forEach(a=>a.length&&o.push(a.shift()))});pend=o}
 const days=[];let d=new Date(),cur;
 const next=()=>{let g=0;while(S.off.includes(d.getDay())&&g++<7)d.setDate(d.getDate()+1);cur={k:dk(d),dt:new Date(d),it:[],u:0};days.push(cur);d.setDate(d.getDate()+1)};
 next();pend.forEach(l=>{const m=act(l);if(cur.u+m>cap&&cur.it.length&&days.length<400)next();cur.it.push(l);cur.u+=m});
 return{days,pend,tot:pend.reduce((a,l)=>a+act(l),0)};
}
const dd=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const avail=()=>{let n=0;for(let i=0,k=dd(dk(),S.dl);i<=k&&i<400;i++)if(!S.off.includes(new Date(add(i)+'T00:00').getDay()))n++;return n};
function health(p){
 if(!p.pend.length)return{c:'ok',t:'All clear',fin:null,sl:0};
 const fin=p.days[p.days.length-1].k,sl=dd(fin,S.dl);
 return{c:sl>=2?'ok':sl>=0?'wn':'bad',t:sl>=2?'On track':sl>=0?'Tight':'At risk',fin,sl,need:Math.ceil(p.tot/60/Math.max(1,avail())*2)/2};
}
const fd=k=>new Date(k+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const revDue=()=>S.lecs.filter(l=>l.st==='done'&&l.doneOn).flatMap(l=>[1,3,7,21].map(n=>({l,n,k:add(n,l.doneOn)})).filter(r=>r.k<=dk()&&!(l.rv||[]).includes(r.n)));

function subjectIcon(name){const n=String(name||'').toLowerCase();if(/botany|plant/.test(n))return '🌿';if(/zoology|animal/.test(n))return '🦋';if(/biology|bio/.test(n))return '🧬';if(/physics/.test(n))return '⚛️';if(/chemistry|organic|inorganic/.test(n))return '🧪';if(/math/.test(n))return '📐';if(/english/.test(n))return '📖';if(/hindi|language/.test(n))return '📝';if(/computer|informatics|programming/.test(n))return '💻';if(/history/.test(n))return '🏛️';if(/geography/.test(n))return '🌍';if(/economics/.test(n))return '📊';return '📚'}
function row(l,opt){const s=sOf(l.sub),dn=l.st==='done';
 return `<div class="row ${dn?'dn':''}" style="--c:${s.c}"><div class="r"><span class="subject-icon" title="${esc(s.n)}">${subjectIcon(s.n)}</span><button class="ck ${dn?'on':''}" data-tg="${l.id}" aria-label="Toggle done">${dn?'✓':''}</button><div style="flex:1"><div class="t">${esc(l.t)}</div><div class="m">${esc(s.n)} · ${esc(l.ch)} · ${hm(act(l))} at ${l.spd||S.spd}x</div></div>${opt==='bl'?`<button class="sm" data-pri="${l.id}" style="color:${PC[l.pri]}">● ${P[l.pri]}</button><button class="sm" data-ed="${l.id}" aria-label="Edit">✎</button><button class="sm" data-del="${l.id}" aria-label="Delete">✕</button>`:opt==='td'&&!dn?`<button class="sm on" data-fl="${l.id}" aria-label="Focus on this lecture">▶</button>`:''}</div></div>`}

function today(){
 const p=plan(),h=health(p),tot=S.lecs.length,dn=S.lecs.filter(l=>l.st==='done').length,pc=tot?Math.round(dn/tot*100):0;
 const todayKey=dk(),todayPlan=p.days.find(x=>x.k===todayKey),autoToday=todayPlan?todayPlan.it:[],hasCustom=Object.prototype.hasOwnProperty.call(S.customPlans||{},todayKey),chosenIds=hasCustom?S.customPlans[todayKey]:null,tp=hasCustom?(chosenIds||[]).map(id=>S.lecs.find(l=>l.id===id)).filter(Boolean):autoToday,rv=revDue(),studied=lm(todayKey);
 const doneToday=S.lecs.filter(l=>l.st==='done'&&l.doneOn===todayKey).length;
 const pendingToday=tp.filter(l=>l.st!=='done');
 const subjectButtons=S.subs.map(s=>`<button class="sm" data-go="backlog">${esc(s.n)} · ${S.lecs.filter(l=>l.sub===s.id&&l.st!=='done').length} pending</button>`).join('');
 return `<div class="m">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div>
 <div class="r b"><h1>Today's Plan</h1><button class="sm" data-go="planner">⚙ Plan</button></div>
 <div class="hero"><div class="r b"><span class="m">Daily study target</span><span class="chip2 ${studied>=S.goal*60?'ok':'wn'}">${studied>=S.goal*60?'Goal reached':'In progress'}</span></div>
 <div class="r b" style="margin-top:12px"><b class="n">${hm(studied)}</b><span class="m">of ${S.goal}h</span></div>

function tick(){const n=Date.now();if(dk()!==day0){day0=dk();return render()}if(T.run&&T.mode==='cd'&&n>=T.end)return fin();const tt=document.getElementById('tt');if(!tt)return;let s,f;
 if(T.mode==='cd'){const ms=T.run?Math.max(0,T.end-n):T.dur*6e4;if(T.run&&ms<=0){return fin()}s=Math.ceil(ms/1e3);f=T.run?1-ms/(T.dur*6e4):0}else{s=T.run?Math.floor((n-T.start)/1e3):0;f=T.run?(s%3600)/3600:0}
 tt.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');document.getElementById('tl').textContent=T.run?'Focusing on '+sOf(T.sub).n:'Ready';document.getElementById('tp').style.width=f*100+'%'}
setInterval(tick,250);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
let AC;const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}};
const SX={nav:[[520,0,.05]],tick:[[900,0,.03,'square',.12]],pop:[[700,0,.05],[1000,.05,.07]],ok:[[660,0,.09],[880,.09,.14]],done:[[784,0,.12],[988,.13,.12],[1175,.26,.3]],undo:[[600,0,.07],[420,.07,.1]],del:[[300,0,.09,'triangle'],[180,.08,.14,'triangle']],add:[[523,0,.08],[659,.08,.08],[784,.16,.14]],pri:[[440,0,.07,'triangle']],start:[[392,0,.08],[523,.08,.08],[659,.16,.16]],stop:[[523,0,.08],[392,.08,.16]],err:[[150,0,.2,'sawtooth',.2]],fin:[[880,0,.25],[1175,.3,.25],[1480,.6,.5]]};
function sfx(n){const s=SX[n];if(!S.ui.snd||!s)return;ac();if(!AC)return;const c=AC.currentTime;s.forEach(([f,st,d,ty,g])=>{const o=AC.createOscillator(),v=AC.createGain();o.type=ty||'sine';o.frequency.value=f;o.connect(v);v.connect(AC.destination);v.gain.setValueAtTime(.0001,c+st);v.gain.exponentialRampToValueAtTime(Math.max(.0002,(g||.3)*S.ui.vol),c+st+.01);v.gain.exponentialRampToValueAtTime(.0001,c+st+d);o.start(c+st);o.stop(c+st+d+.02)})}
function beep(){sfx('fin')}
function beepOld(){try{const a=AC,o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2)}catch(e){}}
function fin(){addLog(T.dur,T.sub);T.run=0;saveT();beep();try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}toast('Session done. '+T.dur+' min logged.');render()}
let TO;function toast(m,undo){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.innerHTML=esc(m)+(undo?' <button data-undo>Undo</button>':'');e.style.display='flex';clearTimeout(TO);TO=setTimeout(()=>e.style.display='none',5000)}
function stopT(){const el=T.mode==='cd'?T.dur*6e4-Math.max(0,T.end-Date.now()):Date.now()-T.start;addLog(el/6e4,T.sub);T.run=0;saveT()}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;let r=1;
 if(D.go){U.v=D.go;U.day=0}
 else if(D.tg){U.snap=JSON.stringify(S);const l=S.lecs.find(x=>x.id===D.tg);l.st=l.st==='done'?'todo':'done';l.doneOn=l.st==='done'?dk():null;l.rv=[];toast(l.st==='done'?'Marked done. Revisions scheduled.':'Marked pending',1)}
 else if(D.rv){const[i,n]=D.rv.split('|'),l=S.lecs.find(x=>x.id===i);l.rv=(l.rv||[]).concat(+n)}
 else if(D.pri){const l=S.lecs.find(x=>x.id===D.pri);l.pri=l.pri%3+1}
 else if(D.del){U.snap=JSON.stringify(S);S.lecs=S.lecs.filter(x=>x.id!==D.del);toast('Lecture deleted',1)}
 else if(D.add!==undefined)U.add=U.add?0:1;
 else if(D.planToggle!==undefined)U.customizeToday=U.customizeToday?0:1;
 else if(D.planSave!==undefined){const ids=[...document.querySelectorAll('[data-plan-item]:checked')].map(x=>x.dataset.planItem);S.customPlans=S.customPlans||{};S.customPlans[dk()]=ids;U.customizeToday=0;toast(`Today's plan saved · ${ids.length} lectures`)}
 else if(D.planAuto!==undefined){S.customPlans=S.customPlans||{};delete S.customPlans[dk()];U.customizeToday=0;toast('Automatic plan restored')}
 else if(D.rmsub){const sub=S.subs.find(x=>x.id===D.rmsub);if(S.subs.length<=1){alert('At least one subject must remain.');r=0}else if(sub&&confirm(`Remove ${sub.n} and all ${S.lecs.filter(l=>l.sub===sub.id).length} lectures inside it? This cannot be undone unless you restore a backup.`)){S.lecs=S.lecs.filter(l=>l.sub!==sub.id);S.subs=S.subs.filter(x=>x.id!==sub.id);Object.keys(S.customPlans||{}).forEach(k=>S.customPlans[k]=S.customPlans[k].filter(id=>S.lecs.some(l=>l.id===id)));if(U.sub===D.rmsub)U.sub='all';toast(`${sub.n} removed`) }else r=0;}
 else if(D.save!==undefined){const ch=document.getElementById('ac').value.trim(),sb=document.getElementById('as').value,pr=+document.getElementById('ap').value,count=Math.min(100,Math.max(1,parseInt(document.getElementById('an').value,10)||1)),dur=Math.min(600,Math.max(1,parseInt(document.getElementById('ad').value,10)||120)),spd=Math.min(2.5,Math.max(1,+document.getElementById('av').value||1.5));
  if(!ch){sfx('err');alert('Please enter a chapter name.');r=0}else{U.snap=JSON.stringify(S);for(let i=1;i<=count;i++){S.lecs.push(mk(sb,ch,`Lecture ${String(i).padStart(2,'0')}`,dur,pr,spd))}U.add=0;U.sub='all';toast(`${count} lecture${count===1?'':'s'} added for ${ch}`,1)}}
 else if(D.nameEdit!==undefined){const n=prompt('Enter your student name',S.studentName||'NEET Aspirant');if(n!==null){S.studentName=n.trim().slice(0,50)||'NEET Aspirant';toast('Student name updated')}}
 else if(D.ns!==undefined){const n=(prompt('New subject name')||'').trim().slice(0,40);if(n){S.subs.push({id:uid(),n,c:['#4b3fe0','#e08a00','#0f9d72','#e0334f','#0a84c6','#b5379c','#6b7a1a'][S.subs.length%7]});U.sub='all'}else r=0}
 else if(D.ed){const l=S.lecs.find(x=>x.id===D.ed),v=prompt('Edit: title | minutes',l.t+' | '+l.dur);if(v==null)r=0;else{U.snap=JSON.stringify(S);const i=v.lastIndexOf('|'),d=i>=0?pdur(v.slice(i+1)):0,s=(d?v.slice(0,i):v).trim();if(s)l.t=s.slice(0,120);if(d)l.dur=d;toast('Lecture updated',1)}}
 else if(D.fl){const l=S.lecs.find(x=>x.id===D.fl);T.sub=l.sub;if(!T.run)T.mode='cd';U.v='focus'}
 else if(D.mix){S.mix=D.mix}
 else if(D.undo!==undefined){if(U.snap){S=JSON.parse(U.snap);U.snap=null}document.getElementById('toast').style.display='none'}
 else if(D.th){S.ui.th=0;S.ui.theme=D.th}
 else if(D.ac)S.ui.acc=D.ac
 else if(D.tl)S.ui.tile=D.tl==='auto'?'':D.tl
 else if(D.gl!==undefined)S.ui.glass=S.ui.glass?0:1
 else if(D.wp){if(D.wp==='upload'){document.getElementById('uw').click();r=0}else S.ui.wp=D.wp}
 else if(D.upl!==undefined){document.getElementById('uw').click();r=0}
 else if(D.sn!==undefined)S.ui.snd=S.ui.snd?0:1
 else if(D.wt){const w=S.ui.w;S.ui.w=w.includes(D.wt)?w.filter(x=>x!==D.wt):w.concat(D.wt)}
 else if(D.wm){const[k,s]=D.wm.split('|'),w=S.ui.w,i=w.indexOf(k),j=i+ +s;if(j>=0&&j<w.length){[w[i],w[j]]=[w[j],w[i]]}else r=0}
 else if(D.pre){const[h,s,x]=D.pre.split('|');S.hrs=+h;S.spd=+s;S.mix=x}
 else if(D.hrs)S.hrs=Math.min(12,Math.max(1,S.hrs+ +D.hrs))
 else if(D.spd)S.spd=+D.spd
 else if(D.rst!==undefined)S.ui=normUI({wp:S.ui.wp,w:S.ui.w})
 else if(D.pl!==undefined){r=0;sfx(D.pl)}
 else if(D.sub)U.sub=D.sub;
 else if(D.day)U.day=+D.day;
 else if(D.day==='0')U.day=0;
 else if(D.off){const i=+D.off;S.off=S.off.includes(i)?S.off.filter(x=>x!==i):S.off.concat(i);if(S.off.length>=7)S.off=[]}
 else if(D.tm){if(!T.run)T.mode=D.tm}
 else if(D.dur){if(!T.run)T.dur=+D.dur}
 else if(D.goT!==undefined){if(T.run)stopT();else{ac();T.run=1;T.start=Date.now();T.end=T.start+T.dur*6e4;saveT()}}
 else if(D.exp!==undefined){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='backlog-planner-'+dk()+'.json';a.click();r=0}
 else if(D.imp!==undefined){document.getElementById('fi').click();r=0}
 else if(D.reset!==undefined){if(confirm('Delete all data?'))S=seed();else r=0}
 else r=0;
 if(r){const SM={go:'nav',tg:'ok',rv:'ok',pri:'pri',del:'del',save:'add',ns:'add',ed:'pop',fl:'start',undo:'undo',reset:'del',hrs:'tick',spd:'tick',sub:'tick',day:'tick',off:'tick',mix:'tick',tm:'tick',dur:'tick'};
  sfx(D.goT!==undefined?(T.run?'start':'stop'):D.tg?(S.lecs.find(x=>x.id===D.tg).st==='done'?'done':'undo'):SM[Object.keys(D)[0]]||'pop');save();render()}});
const rp=()=>{const d=document.createElement('div');d.innerHTML=planner();document.getElementById('pl').innerHTML=d.querySelector('#pl').innerHTML};
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){U.q=t.value;document.getElementById('bl').innerHTML=bl()}
 else if(t.id==='hr'){S.hrs=+t.value;save();U.day=0;document.getElementById('hv').textContent=S.hrs+'h';document.getElementById('wt').hidden=S.hrs<9;rp()}
 else if(t.id==='sp'){S.spd=+t.value;save();document.getElementById('sv').textContent=S.spd+'x';rp()}
 else if(t.id==='gl'){S.goal=+t.value;save();document.getElementById('gv').textContent=S.goal+'h'}
 else if(t.id==='ua'){S.ui.acc=t.value;save();applyUI()}
 else if(t.id==='ut'){S.ui.tile=t.value;save();applyUI()}
 else if(t.id==='ud'){S.ui.dim=+t.value;save();applyUI();t.previousElementSibling.lastChild.textContent=t.value+'%'}
 else if(t.id==='uv'){S.ui.vol=+t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='uv')sfx('pop');
 else if(t.id==='ua'||t.id==='ut')render();
 else if(t.id==='uw'&&t.files[0]){const f=new FileReader();f.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1100/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{localStorage.setItem(K+'-wp',c.toDataURL('image/jpeg',.7));S.ui.wp='custom';save();render();sfx('ok')}catch(x){toast('Image too large to store');sfx('err')}};im.onerror=()=>{toast('Could not read this image');sfx('err')};im.src=f.result};f.readAsDataURL(t.files[0]);t.value=''}
 else if(t.id==='ts')T.sub=t.value;
 else if(t.id==='dl'&&t.value){S.dl=t.value;save();render()}
 else if(t.id==='fi'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);const z=norm(d);if(z){S=z;save();render()}else alert('Not a valid backup.')}catch(x){alert('Could not read this file.')}};f.readAsText(t.files[0]);t.value=''}});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();
